<template id="rulesTpl">
  <h2>Как играть</h2>
  <p>Это дурак, только отбиваешься покерными комбинациями. В колоде 52 карты и 2 джокера, на руке 8, козырь лежит под колодой.</p>
  <h3>Ход</h3>
  <ul>
    <li>Атакуешь одиночкой, парой, тройкой, двумя парами, каре или пятью картами.</li>
    <li>Кроют <b>тем же числом карт</b> и комбинацией старше. Одиночку бьют как в обычном дураке: старшей той же масти или козырем.</li>
    <li data-rule="over"><b>Перекрытие:</b> на атаку из 2+ карт можно лечь комбинацией старшего типа ровно на одну карту больше: на две пары — стритом или флешем, на пару — сетом. Атакующий получает +1 заряда.</li>
    <li>Отбился — атакующий может подкинуть <b>комбинацию</b> с номиналом со стола (одиночкой не подкидывают). Отбился от всего — «Бито».</li>
    <li data-rule="typeThrow"><b>Подкидывание по типу:</b> если карты стола уже сложились в комбинацию (две десятки — пара), подкидывай такую же любым номиналом.</li>
    <li data-rule="upgrade"><b>Апгрейд:</b> пока соперник думает, можно один раз за ход доложить карты к своей непокрытой атаке, чтобы она стала старше (к 10♠ — 10♦, и крыть надо уже пару).</li>
    <li>Кнопка <b>⟳ Подбор</b> листает все ходы, которые можно сделать прямо сейчас.</li>
    <li>Не можешь — «Беру». Атакующий подкидывает вдогонку и ходит снова.</li>
    <li>В атаке за ход не больше карт, чем было у защитника, и не больше 8.</li>
    <li>Первым ходит тот, у кого младший козырь. Колода кончилась — кто первым скинул всё, тот не дурак.</li>
  </ul>
  <h3>Чем крыть</h3>
  <div class="rank">
    <span>1</span><span>Одиночка</span><span>старше той же масти или козырь</span>
    <span>2</span><span>Пара</span><span>старшая пара</span>
    <span>3</span><span>Мини-флеш</span><span>3 одной масти</span>
    <span>3</span><span>Мини-стрит</span><span>3 подряд</span>
    <span>3</span><span>Сет</span><span>3 одинаковые</span>
    <span>3</span><span>Мини-стрит-флеш</span><span>старшая тройка</span>
    <span>4</span><span>Две пары</span><span></span>
    <span>4</span><span>Каре</span><span>бьёт две пары</span>
    <span>5</span><span>Стрит</span><span></span>
    <span>5</span><span>Флеш</span><span>бьёт стрит</span>
    <span>5</span><span>Фулл-хаус</span><span>бьёт флеш</span>
    <span>5</span><span>Стрит-флеш</span><span>старше всех из пяти</span>
  </div>
  <p>Если тип одинаковый, сначала смотрят, где больше козырей, потом старшинство карт.</p>
  <div data-rule="mognul"><h3>«Могнул»</h3>
  <p>Покрыл комбинацией старшего типа или с козырем против некозырной — ты <b>могнул</b>: сопернику сразу +1 штраф, тебе +1 заряд.</p></div>
  <div data-rule="charge"><h3>Заряд и карты-действия</h3>
  <p>Заряд дают «могнул», перевод, одиночка, покрытая той же мастью без козыря, и три отбитые атаки за ход. Три деления заряда — выбираешь одну из двух карт-действий. Её масть — масть твоей последней карты.</p>
  <ul>
    <li><b>Щит</b> — при защите: атака с его мастью уходит в бито. Козырный щит отбивает любую.</li>
    <li><b>Разворот ↺</b> — при защите, пока ничего не покрыто: атака возвращается атакующему (если в ней есть его масть). Вместо своего хода — пас.</li>
    <li><b>+2</b> — в свой ход: соперник добирает 2 карты (козырная — 3), при пустой колоде — штрафные очки.</li>
    <li><b>Смена козыря ↻</b> — в свой ход: козырем становится масть карты.</li>
  </ul></div>
  <h3>Джокеры</h3>
  <p>Джокер становится той картой, которая делает комбинацию сильнее. Одиночный джокер — старший козырь, его бьёт только козырной туз.</p>
  <div data-rule="transfer"><h3>Перевод</h3>
  <p>Пока на атаку никто не ответил, её можно перевести комбинацией того же типа и старшинства.</p></div>
  <h3>Наборы правил</h3>
  <p><b>Классика</b> — комбинации, подкидывание и перевод. <b>Полные</b> — всё. В карьере правила открываются по районам: Подъезд — классика без перевода, Двор — перевод, Рынок — «могнул» и заряд, Вокзал — перекрытие и апгрейд, Казино — всё сразу.</p>
  <h3>Матч</h3>
  <p>Играют матч до нужного числа побед: одна партия, до 2 или до 3 побед. В карьере соседи — до 2 побед, боссы — до 3; дейли и босс недели — одна партия; в своей игре и онлайне формат выбираешь сам. Ничья в матче не засчитывается.</p>
  <p>Штрафные очки остаются как счёт позора: проигравший партию получает столько, сколько карт у него осталось (не больше 10), «могнул» — +1 сопернику. Они видны мелко, идут в щелбаны и статистику, но матч решают победы. В Блице у каждого 2,5 минуты на всю партию: время кончилось — партия проиграна (штраф не меньше 3).</p>
</template>
